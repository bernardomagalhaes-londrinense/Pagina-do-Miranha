<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conheça o Miranha - Formulário</title>
</head>
<body>
    <header>
        <h1>PREENCHA ESSE FORMULÁRIO PARA CONHECER O MIRANHA: 100% LEGÍTIMO!!!!! :O</h1>
    </header>
    <main>
        <form>
            <label for="full-name">INSIRA SEU NOME COMPLETO!!!</label>
            <input type="text" id="full-name" placeholder="INSIRA SEU NOME COMPLETO!!!">
            <br>
            <label for="">INSIRA SEU EMAIL DO GOOGLE</label>
            <input type="email" id="your-email" placeholder="INSIRA SEU EMAIL">
            <br>
            <label for="age">INSIRA SUA IDADE :O</label>
            <input type="number" name="age" id="age" placeholder="INSIRA SUA IDADE :O">
            <br>
            <label for="adress">INSIRA SEU ENDEREÇO COMPLETO</label>
            <input type="text" id="adress" placeholder="INSIRA SEU ENDEREÇO COMPLETO">
            <br>
            <label for="">INSIRA SUA SENHA</label>
            <input type="password" id="password" placeholder="INSIRA SUA SENHA">
            <input type="submit" value="ENVIAR">
        </form>
    </main>
</body>
</html>
